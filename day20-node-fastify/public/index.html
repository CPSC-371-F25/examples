<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Fastify Demo</title>
</head>

<body>
    <h1>A couple of forms!</h1>
    <p>This is all being served from Fastify.</p>
    <p>This static page is served from /public, and the form submissions below get submitted to the API endpoints we
        created</p>

    <h2>Contact Us</h2>
    <form action="/submit" method="post">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send</button>
    </form>
</body>

</html>
